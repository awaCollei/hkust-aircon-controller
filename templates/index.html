<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKUST 空调智能控制器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }
        
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        
        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(252, 129, 129, 0.4);
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(237, 137, 54, 0.4);
        }
        
        .btn-secondary {
            background: #a0aec0;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #718096;
            transform: translateY(-2px);
        }
        
        .btn-running {
            background: #e53e3e;
            color: white;
        }
        
        .btn-running:hover {
            background: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.4);
        }
        
        .btn-stopped {
            background: #48bb78;
            color: white;
        }
        
        .btn-stopped:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .status-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .status-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        
        .status-value.on {
            color: #48bb78;
        }
        
        .status-value.off {
            color: #fc8181;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .badge-success {
            background: #48bb78;
            color: white;
        }
        
        .badge-danger {
            background: #fc8181;
            color: white;
        }
        
        /* 定时卡片 */
        .schedule-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .schedule-card {
            background: white;
            padding: 18px 20px;
            border-radius: 12px;
            border-left: 4px solid #48bb78;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .schedule-card.off-card {
            border-left-color: #fc8181;
        }
        
        .schedule-card.loop-card {
            border-left-color: #667eea;
        }
        
        .schedule-card .card-icon {
            font-size: 22px;
            flex-shrink: 0;
        }
        
        .schedule-card .card-label {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            flex-shrink: 0;
        }
        
        .schedule-card .card-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 120px;
        }
        
        .schedule-card .card-input-group input {
            width: 70px;
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            transition: border-color 0.3s;
        }
        
        .schedule-card .card-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .schedule-card .card-input-group .unit {
            font-size: 14px;
            color: #888;
            flex-shrink: 0;
        }
        
        .schedule-card .card-input-group .action-text {
            font-size: 14px;
            color: #555;
            flex-shrink: 0;
        }
        
        .schedule-card.on-card .card-input-group input {
            border-color: #48bb78;
        }
        .schedule-card.on-card .card-input-group input:focus {
            border-color: #38a169;
        }
        
        .schedule-card.off-card .card-input-group input {
            border-color: #fc8181;
        }
        .schedule-card.off-card .card-input-group input:focus {
            border-color: #f56565;
        }
        
        .schedule-card.loop-card .card-input-group input {
            border-color: #667eea;
        }
        .schedule-card.loop-card .card-input-group input:focus {
            border-color: #5a67d8;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .button-group .btn {
            flex: 1;
            min-width: 100px;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
            display: block;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
            display: block;
        }
        
        .info-box {
            background: #f0f4ff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #555;
            border-left: 4px solid #667eea;
        }
        
        .info-box code {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        
        .timer-display {
            background: white;
            padding: 10px 16px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            color: #333;
            border: 2px solid #e2e8f0;
        }
        
        .timer-display.running {
            border-color: #48bb78;
            background: #f0fff4;
        }
        
        .timer-display.stopped {
            border-color: #fc8181;
            background: #fff5f5;
        }
        
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-green {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .badge-red {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
        }
        .status-indicator.on {
            background: #c6f6d5;
            color: #22543d;
        }
        .status-indicator.off {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .log-section {
            max-height: 200px;
            overflow-y: auto;
            background: #1a202c;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .log-entry {
            padding: 2px 0;
        }
        
        .log-entry.success {
            color: #48bb78;
        }
        
        .log-entry.error {
            color: #fc8181;
        }
        
        .log-entry.info {
            color: #63b3ed;
        }
        
        .log-entry.warning {
            color: #ed8936;
        }
        
        .loop-info {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            border: 2px solid #667eea;
            background: #f0f4ff;
            display: none;
        }
        
        .loop-info.show {
            display: block;
        }
        
        .loop-info .highlight {
            color: #667eea;
            font-weight: 700;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .schedule-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .schedule-card {
                padding: 14px 16px;
            }
            .schedule-card .card-input-group input {
                width: 60px;
            }
            .status-card {
                grid-template-columns: 1fr 1fr;
            }
            .input-group {
                flex-direction: column;
            }
            .button-group .btn {
                flex: 1 1 45%;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❄️ <span>HKUST 空调智能控制器</span></h1>
        
        <!-- Token 输入 -->
        <div class="section">
            <div class="section-title">🔑 身份验证</div>
            <div class="input-group">
                <input type="text" id="tokenInput" placeholder="输入你的 Bearer Token..." value="">
                <button class="btn btn-primary" onclick="getStatus()">连接并获取状态</button>
            </div>
            <div id="alertMessage" class="alert"></div>
        </div>
        
        <!-- 状态显示 -->
        <div class="section" id="statusSection" style="display:none;">
            <div class="section-title">
                📊 空调状态
                <span id="statusBadge" class="status-badge badge-success">开启</span>
            </div>
            <div class="status-card" id="statusCard">
                <div class="status-item">
                    <div class="status-label">设备名称</div>
                    <div class="status-value" id="deviceName">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">电压 (V)</div>
                    <div class="status-value" id="voltage">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">电流 (A)</div>
                    <div class="status-value" id="current">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">功率 (kW)</div>
                    <div class="status-value" id="power">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">功率因数</div>
                    <div class="status-value" id="powerFactor">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">累计用电 (kWh)</div>
                    <div class="status-value" id="kwh">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">上次更新</div>
                    <div class="status-value" id="updateTime" style="font-size:14px;">-</div>
                </div>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-success" onclick="toggleAC('on')">🟢 开启空调</button>
                <button class="btn btn-danger" onclick="toggleAC('off')">🔴 关闭空调</button>
                <button class="btn btn-primary" onclick="getStatus()">🔄 刷新状态</button>
            </div>
        </div>
        
        <!-- 定时设置 -->
        <div class="section">
            <div class="section-title">⏰ 循环定时</div>
            
            <div class="schedule-row">
                <!-- 开启卡片 -->
                <div class="schedule-card on-card">
                    <span class="card-icon">🟢</span>
                    <div class="card-input-group">
                        <input type="number" id="onDelay" placeholder="0" min="0" value="30" onchange="calculateEndTime()" oninput="calculateEndTime()">
                        <span class="unit">分钟后</span>
                        <span class="action-text">开启</span>
                    </div>
                </div>
                
                <!-- 关闭卡片 -->
                <div class="schedule-card off-card">
                    <span class="card-icon">🔴</span>
                    <div class="card-input-group">
                        <input type="number" id="offDelay" placeholder="0" min="0" value="30" onchange="calculateEndTime()" oninput="calculateEndTime()">
                        <span class="unit">分钟后</span>
                        <span class="action-text">关闭</span>
                    </div>
                </div>
                
                <!-- 循环次数卡片 -->
                <div class="schedule-card loop-card">
                    <span class="card-icon">🔄</span>
                    <div class="card-input-group">
                        <input type="number" id="loopCount" placeholder="0" min="0" value="5" onchange="calculateEndTime()" oninput="calculateEndTime()">
                        <span class="unit">次</span>
                        <span class="action-text">循环</span>
                    </div>
                </div>
            </div>
            
            <!-- 循环信息显示 -->
            <div id="loopInfo" class="loop-info">
                📅 <span id="loopInfoText">总计 0 分钟</span>
            </div>
            
            <div class="info-box">
                💡 <strong>循环定时说明：</strong><br>
                • 设置「开启间隔」和「关闭间隔」，空调会在两个状态间循环<br>
                • 「循环次数」设置总共循环多少次（0 表示无限循环）<br>
                • 启动时会根据当前状态自动选择先执行哪个操作<br>
                • 循环完成后自动停止定时（不会退出程序）
            </div>
            
            <div class="button-group">
                <button class="btn btn-stopped" id="btnTimerToggle" onclick="toggleTimer()">▶️ 启动定时</button>
                <button class="btn btn-secondary" onclick="syncScheduleStatus()">📋 查看任务</button>
            </div>
            
            <div id="scheduleStatus" class="timer-display stopped" style="margin-top:10px;">
                ⏸️ 定时未启动
            </div>
        </div>
        
        <!-- 日志 -->
        <div class="section">
            <div class="section-title">📝 操作日志</div>
            <div class="log-section" id="logContainer">
                <div class="log-entry info">等待操作...</div>
            </div>
        </div>
    </div>
    
    <script>
        let currentToken = '';
        let timerRunning = false;
        let currentStatus = null;
        let statusUpdateInterval = null;
        
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = 'alert alert-' + type;
            setTimeout(() => {
                alert.className = 'alert';
            }, 5000);
        }
        
        function addLog(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            entry.textContent = `[${timestamp}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            while (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }
        }
        
        async function calculateEndTime() {
            const onDelay = parseInt(document.getElementById('onDelay').value) || 0;
            const offDelay = parseInt(document.getElementById('offDelay').value) || 0;
            const loopCount = parseInt(document.getElementById('loopCount').value) || 0;
            
            const loopInfo = document.getElementById('loopInfo');
            const loopInfoText = document.getElementById('loopInfoText');
            
            if (loopCount <= 0 || (onDelay <= 0 && offDelay <= 0)) {
                loopInfo.classList.remove('show');
                return;
            }
            
            try {
                const response = await fetch('/api/schedule/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        on_delay: onDelay,
                        off_delay: offDelay,
                        loop_count: loopCount
                    })
                });
                
                const data = await response.json();
                
                if (data.total_minutes > 0) {
                    let parts = [];
                    if (data.days > 0) parts.push(`${data.days}天`);
                    if (data.hours > 0) parts.push(`${data.hours}小时`);
                    if (data.minutes > 0) parts.push(`${data.minutes}分钟`);
                    
                    loopInfoText.innerHTML = `总计 <span class="highlight">${parts.join('')}</span>，直至 <span class="highlight">${data.end_time_str}</span>`;
                    loopInfo.classList.add('show');
                } else {
                    loopInfo.classList.remove('show');
                }
            } catch (error) {
                console.error('计算失败:', error);
            }
        }
        
        async function getStatus() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                showAlert('请输入Token', 'error');
                return;
            }
            
            currentToken = token;
            
            try {
                const response = await fetch('/api/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showAlert('错误: ' + data.error, 'error');
                    addLog('❌ 获取状态失败: ' + data.error, 'error');
                    return;
                }
                
                currentStatus = data;
                
                document.getElementById('statusSection').style.display = 'block';
                document.getElementById('deviceName').textContent = data.device_name;
                document.getElementById('voltage').textContent = data.voltage.toFixed(1);
                document.getElementById('current').textContent = data.current.toFixed(3);
                document.getElementById('power').textContent = data.power.toFixed(4);
                document.getElementById('powerFactor').textContent = data.power_factor.toFixed(4);
                document.getElementById('kwh').textContent = data.kwh.toFixed(2);
                document.getElementById('updateTime').textContent = data.time;
                
                const badge = document.getElementById('statusBadge');
                if (data.is_on) {
                    badge.textContent = '🟢 开启';
                    badge.className = 'status-badge badge-success';
                } else {
                    badge.textContent = '🔴 关闭';
                    badge.className = 'status-badge badge-danger';
                }
                
                showAlert('状态更新成功', 'success');
                addLog(`✅ 获取状态成功: ${data.device_name} - ${data.status_text}`, 'success');
                
                await syncScheduleStatus();
                
            } catch (error) {
                showAlert('请求失败: ' + error.message, 'error');
                addLog('❌ 请求失败: ' + error.message, 'error');
            }
        }
        
        async function toggleAC(action) {
            if (!currentToken) {
                showAlert('请先获取状态', 'error');
                return;
            }
            
            const actionText = action === 'on' ? '开启' : '关闭';
            
            try {
                const response = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: currentToken, action: action })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showAlert('错误: ' + data.error, 'error');
                    addLog('❌ ' + actionText + '失败: ' + data.error, 'error');
                    return;
                }
                
                showAlert(data.message, 'success');
                addLog('✅ ' + data.message, 'success');
                setTimeout(getStatus, 500);
                
            } catch (error) {
                showAlert('请求失败: ' + error.message, 'error');
                addLog('❌ 请求失败: ' + error.message, 'error');
            }
        }
        
        async function toggleTimer() {
            if (!currentToken) {
                showAlert('请先获取状态', 'error');
                return;
            }
            
            if (timerRunning) {
                await stopTimer();
            } else {
                await startTimer();
            }
        }
        
        async function startTimer() {
            const onDelay = parseInt(document.getElementById('onDelay').value) || 0;
            const offDelay = parseInt(document.getElementById('offDelay').value) || 0;
            const loopCount = parseInt(document.getElementById('loopCount').value) || 0;
            
            if (onDelay <= 0 && offDelay <= 0) {
                showAlert('请设置至少一个有效的时间', 'error');
                return;
            }
            
            if (loopCount < 0) {
                showAlert('循环次数不能为负数', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: currentToken,
                        on_delay: onDelay,
                        off_delay: offDelay,
                        loop_count: loopCount
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showAlert('错误: ' + data.error, 'error');
                    addLog('❌ 启动定时失败: ' + data.error, 'error');
                    return;
                }
                
                timerRunning = data.enabled;
                updateTimerButton();
                
                if (data.enabled) {
                    const statusText = currentStatus ? (currentStatus.is_on ? '开启' : '关闭') : '未知';
                    const firstAction = currentStatus && currentStatus.is_on ? 
                        (offDelay > 0 ? '先关闭' : '等待开启') : 
                        (onDelay > 0 ? '先开启' : '等待关闭');
                    
                    const loopText = loopCount > 0 ? `循环${loopCount}次` : '无限循环';
                    
                    showAlert(data.message, 'success');
                    addLog(`✅ ${data.message} (当前状态: ${statusText}, ${firstAction}, ${loopText})`, 'success');
                    
                    document.getElementById('scheduleStatus').className = 'timer-display running';
                    document.getElementById('scheduleStatus').innerHTML = 
                        `▶️ 定时运行中 &nbsp;|&nbsp; 当前状态: <span class="status-indicator ${currentStatus && currentStatus.is_on ? 'on' : 'off'}">${statusText}</span><br>` +
                        `<small>${data.message} → ${firstAction} (${loopText})</small>`;
                } else {
                    document.getElementById('scheduleStatus').className = 'timer-display stopped';
                    document.getElementById('scheduleStatus').textContent = '⏸️ 定时已停止';
                }
                
            } catch (error) {
                showAlert('请求失败: ' + error.message, 'error');
                addLog('❌ 请求失败: ' + error.message, 'error');
            }
        }
        
        async function stopTimer() {
            try {
                const response = await fetch('/api/schedule/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    timerRunning = false;
                    updateTimerButton();
                    document.getElementById('scheduleStatus').className = 'timer-display stopped';
                    document.getElementById('scheduleStatus').textContent = '⏸️ 定时已停止';
                    showAlert(data.message, 'success');
                    addLog('✅ ' + data.message, 'success');
                }
            } catch (error) {
                showAlert('请求失败: ' + error.message, 'error');
            }
        }
        
        function updateTimerButton() {
            const btn = document.getElementById('btnTimerToggle');
            if (timerRunning) {
                btn.textContent = '⏹️ 停止定时';
                btn.className = 'btn btn-running';
            } else {
                btn.textContent = '▶️ 启动定时';
                btn.className = 'btn btn-stopped';
            }
        }
        
        async function syncScheduleStatus() {
            try {
                const response = await fetch('/api/schedule/status');
                const data = await response.json();
                
                const wasRunning = timerRunning;
                timerRunning = data.enabled;
                
                if (wasRunning !== timerRunning) {
                    updateTimerButton();
                }
                
                const statusDiv = document.getElementById('scheduleStatus');
                if (data.enabled && data.jobs.length > 0) {
                    statusDiv.className = 'timer-display running';
                    const statusText = currentStatus ? (currentStatus.is_on ? '开启' : '关闭') : '未知';
                    let html = `▶️ 定时运行中 &nbsp;|&nbsp; 当前状态: <span class="status-indicator ${currentStatus && currentStatus.is_on ? 'on' : 'off'}">${statusText}</span><br>`;
                    
                    if (data.is_looping && data.max_loops > 0) {
                        html += `<small>🔄 循环 ${data.max_loops} 次，已执行 ${data.loop_count} 次，剩余 ${data.remaining_loops} 次</small><br>`;
                    } else if (data.is_looping) {
                        html += `<small>🔄 无限循环中，已执行 ${data.loop_count} 次</small><br>`;
                    }
                    
                    data.jobs.forEach(job => {
                        const icon = job.type === '开启' ? '🟢' : '🔴';
                        const nextRun = job.next_run && job.next_run !== 'N/A' ? job.next_run : '等待调度...';
                        html += `<small>${icon} ${job.type} (每${job.delay}分钟) - 下次执行: ${nextRun}</small><br>`;
                    });
                    statusDiv.innerHTML = html;
                } else {
                    statusDiv.className = 'timer-display stopped';
                    statusDiv.textContent = '⏸️ 定时未启动';
                    timerRunning = false;
                    updateTimerButton();
                }
            } catch (error) {
                console.error('获取定时状态失败:', error);
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            const savedToken = localStorage.getItem('aircon_token');
            if (savedToken) {
                document.getElementById('tokenInput').value = savedToken;
                getStatus().then(() => {
                    syncScheduleStatus();
                    calculateEndTime();
                });
            }
            
            // 每60秒刷新一次
            if (statusUpdateInterval) {
                clearInterval(statusUpdateInterval);
            }
            statusUpdateInterval = setInterval(() => {
                if (currentToken) {
                    getStatus();
                    syncScheduleStatus();
                }
            }, 60000);
        });
        
        // 保存token
        document.getElementById('tokenInput').addEventListener('change', function() {
            if (this.value.trim()) {
                localStorage.setItem('aircon_token', this.value.trim());
            }
        });
    </script>
</body>
</html>
